version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/database/schema.sql"
    queries: "internal/database/query.sql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"