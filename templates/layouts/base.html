<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>
        Thinker: {{ .title }}
    </title>
</head>
<body class="bg-zinc-950 text-xs text-zinc-50 p-6 h-14">
    <header class="fixed top-0 left-0 right-0 w-full z-100 p-6">
        <ul class="flex gap-4">
            <!-- el llm principal -->
            <li class="hover:text-zinc-400 transition-all cursor-pointer">Thinker</li>
            <!-- el repositorio de ideas y conexiones, visualizado como grafo -->
            <li class="hover:text-zinc-400 transition-all cursor-pointer">Mis ideas</li>
            <!-- Opciones varias -->
            <li class="hover:text-zinc-400 transition-all cursor-pointer">Opciones</li>

            <li class="hover:text-zinc-400 transition-all cursor-pointer">Mi perfíl</li>

            <li class="hover:text-zinc-400 transition-all cursor-pointer">Configuración</li>

            <li class="hover:text-zinc-400 transition-all cursor-pointer">Soporte</li>
        </ul>
                
    </header>
    <main class="mt-14">

    </main>
    {{ block "content" . }}
    {{ end }}
</body>
</html>
