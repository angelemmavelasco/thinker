<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- htmx -->
     <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <title>
        Thinker: {{ .title }}
    </title>
</head>
<body class="bg-zinc-950 text-xs text-zinc-50 px-4 min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 w-full z-100 p-4 flex justify-between backdrop-blur-xl">
        <ul class="flex gap-4">
            <!-- el llm principal -->
            <li>
                <a href="/"  class="text-cyan-500 hover:text-zinc-500 transition-all font-mono">
                    Thinker
                </a>
            </li>
            <!-- Grafo princiapl -->
            <li class="hover:text-cyan-500 transition-all cursor-pointer">Red</li>
            <!-- crud de ideas -->
            <li class="hover:text-cyan-500 transition-all cursor-pointer">
                <a href='{{url "ideas:list"}}'>
                    Mis ideas
                </a>
            </li>
            <!-- Relaciones y palabras clave -->
            <li class="hover:text-cyan-500 transition-all cursor-pointer">Relaciones</li>
            <!-- Opciones varias -->
            <li class="hover:text-cyan-500 transition-all cursor-pointer">Opciones</li>

            <li class="hover:text-cyan-500 transition-all cursor-pointer">
                <a href='{{url "users:list"}}'>
                    Usuarios
                </a>
            </li>

            <li class="hover:text-cyan-500 transition-all cursor-pointer">Configuración</li>

            <li class="hover:text-cyan-500 transition-all cursor-pointer">Soporte</li>

            <li class="hover:text-red-500 transition-all cursor-pointer">
                <a href='{{ url "landing" }}'>
                    Cerrar sesión
                </a>
            </li>
        </ul>

        <p class="text-zinc-500 font-medium">
            Genera ideas, Thinker hace lo demás.
        </p>


                
    </header>
    <main class="mt-12 flex flex-col gap-4">
        {{ block "content" . }}
        {{ end }}
    </main>

    {{template "footer.html" .}}
</body>
</html>
