<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/media/tk.ico?v={{ faviconVersion }}" />
    <link rel="shortcut icon" type="image/x-icon" href="/media/tk.ico?v={{ faviconVersion }}" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <title>
        Thinker: {{ .title }}
    </title>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.csrf_token}}"}' class="bg-zinc-950 text-xs text-zinc-50 px-3 sm:px-6 min-h-screen flex flex-col antialiased">
    {{template "header.html" .}}

    <main class="mt-16 sm:mt-14 mb-8 flex-1 flex flex-col gap-4">
        {{ block "content" . }}
        {{ end }}
    </main>

    {{template "footer.html" .}}
</body>
</html>
