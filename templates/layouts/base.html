<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/media/tk.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <title>
        Thinker: {{ .title }}
    </title>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.csrf_token}}"}' class="bg-zinc-950 text-xs text-zinc-50 px-4 min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 w-full z-100 p-4 flex gap-8 items-center backdrop-blur-xl">
        <ul class="flex gap-4 items-center">
            <li>
                <a href="/" class="text-cyan-500 hover:text-zinc-500 transition-all font-mono">
                    Thinker
                </a>
            </li>
            <li class="hover:text-cyan-500 transition-all cursor-pointer">
                <a href='{{url "network:view"}}'>
                    Red
                </a>
            </li>
            <li class="hover:text-cyan-500 transition-all cursor-pointer">
                <a href='{{url "ideas:list"}}'>
                    Mis ideas
                </a>
            </li>
            <li class="hover:text-cyan-500 transition-all cursor-pointer">Relaciones</li>
            <li class="hover:text-cyan-500 transition-all cursor-pointer">Opciones</li>

            <li class="hover:text-cyan-500 transition-all cursor-pointer">
                <a href='{{url "users:list"}}'>
                    Usuarios
                </a>
            </li>

            <li class="hover:text-cyan-500 transition-all cursor-pointer">Configuración</li>

            <li class="hover:text-cyan-500 transition-all cursor-pointer">Soporte</li>

            <li>
                <form method="POST" action='{{ url "auth:logout" }}' class="inline">
                    <input type="hidden" name="csrf_token" value="{{.csrf_token}}" />
                    <button type="submit" class="hover:text-red-500 transition-all cursor-pointer">
                        Cerrar sesión
                    </button>
                </form>
            </li>

            <li>
                <form method="POST" action='{{ url "auth:logout_all" }}' class="inline">
                    <input type="hidden" name="csrf_token" value="{{.csrf_token}}" />
                    <button type="submit" title="Revoca inmediatamente todos los dispositivos y tokens activos" class="text-zinc-400 hover:text-red-400 transition-all cursor-pointer">
                        Cerrar todas las sesiones
                    </button>
                </form>
            </li>
        </ul>

        <p class="text-zinc-500 font-medium ml-auto">
            Genera ideas, Thinker hace lo demás.
        </p>

        <div class="flex gap-4 items-center">
            <div class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-blue-600 text-white font-mono select-none">
            A
            </div>
            <p class="text-center">
                @ {{.user}}
            </p>
        </div>
    </header>
    <main class="mt-12 flex flex-col gap-4">
        {{ block "content" . }}
        {{ end }}
    </main>

    {{template "footer.html" .}}
</body>
</html>
