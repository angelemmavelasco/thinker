<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>
        Thinker: {{ .title }}
    </title>
</head>
<body class="bg-zinc-950 text-xs text-zinc-50 px-4">
    <header class="fixed top-0 left-0 right-0 w-full z-100 p-4 flex justify-between">
        <ul class="flex gap-4">
            <!-- el llm principal -->
            <li class="hover:text-pink-400 transition-all cursor-pointer">Thinker</li>
            <!-- Grafo princiapl -->
            <li class="hover:text-pink-400 transition-all cursor-pointer">Red</li>
            <!-- crud de ideas -->
            <li class="hover:text-pink-400 transition-all cursor-pointer">Mis ideas</li>
            <!-- Relaciones y palabras clave -->
            <li class="hover:text-pink-400 transition-all cursor-pointer">Relaciones</li>
            <!-- Opciones varias -->
            <li class="hover:text-pink-400 transition-all cursor-pointer">Opciones</li>

            <li class="hover:text-pink-400 transition-all cursor-pointer">Mi perfíl</li>

            <li class="hover:text-pink-400 transition-all cursor-pointer">Configuración</li>

            <li class="hover:text-pink-400 transition-all cursor-pointer">Soporte</li>
        </ul>

        <p class="text-pink-400">
            Genera ideas, Thinker lo demás.
        </p>
                
    </header>
    <main class="mt-12 flex flex-col gap-4">
        {{ block "content" . }}
        {{ end }}
    </main>
</body>
</html>
