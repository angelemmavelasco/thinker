<div class="flex flex-col gap-1.5">
    <div class="border-b border-cyan-500/80 py-1 flex items-center justify-between">
        <span class="font-medium text-zinc-100 text-xs">Acciones de ideas</span>
    </div>
    <ul class="flex flex-wrap items-center gap-2 py-1 text-xs">
        <li>
            <button
                hx-get="/web/ideas/list"
                hx-target="#workspace"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="border border-zinc-800 hover:border-cyan-500 bg-zinc-900 px-3 py-1.5 rounded-xs hover:text-cyan-400 transition-all cursor-pointer flex items-center gap-1.5 active:scale-95"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-kanban"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/></svg>
                <span>Repositorio de ideas</span>
            </button>
        </li>

        <li>
            <button
                hx-get="/web/ideas/new"
                hx-target="#workspace"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="border border-cyan-500/50 hover:border-cyan-400 bg-cyan-950/40 text-cyan-300 hover:text-cyan-200 px-3 py-1.5 rounded-xs transition-all cursor-pointer flex items-center gap-1.5 active:scale-95 font-medium"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span>Nueva idea</span>
            </button>
        </li>
    </ul>
</div>
