<div class="flex flex-col gap-1.5">
    <div class="border-b border-cyan-500/80 py-1 flex items-center justify-between">
        <span class="font-medium text-zinc-100 text-xs">Acciones de usuarios</span>
    </div>
    <ul class="flex flex-wrap items-center gap-2 py-1 text-xs">
        <li>
            <button
                hx-get="/web/users"
                hx-target="#workspace"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="border border-zinc-800 hover:border-cyan-500 bg-zinc-900 px-3 py-1.5 rounded-xs hover:text-cyan-400 transition-all cursor-pointer flex items-center gap-1.5 active:scale-95"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Usuarios asociados</span>
            </button>
        </li>
        <li>
            <button
                hx-get="/web/users/new"
                hx-target="#workspace"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="border border-cyan-500/50 hover:border-cyan-400 bg-cyan-950/40 text-cyan-300 hover:text-cyan-200 px-3 py-1.5 rounded-xs transition-all cursor-pointer flex items-center gap-1.5 active:scale-95 font-medium"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                <span>Nuevo usuario</span>
            </button>
        </li>
    </ul>
</div>
