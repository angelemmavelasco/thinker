{{define "content"}}

<div>
    <p class="border-b border-cyan-500 py-1">Acciones</p>
    <ul class="flex gap-4 py-1">
        <li>
            <button
            hx-get="/web/ideas/list"
            hx-target="#workspace"
            hx-swap="innerHTML"
            class="hover:text-zinc-400 transition-all cursor-pointer"
            >
                Repositorio de ideas
            </button>
        </li>

        <li>
            <button
            hx-get="/web/ideas/new"
            hx-target="#workspace"
            hx-swap="innerHTML"
            class="hover:text-zinc-400 transition-all cursor-pointer"
            >
                Nueva ideas
            </button>
        </li>
        <li class="hover:text-zinc-400 transition-all cursor-pointer">
            Subir archivo
        </li>
    </ul>
</div>

<section id="workspace">
    {{template "_ideas_list.html" .}}
</section>


{{end}}
