{{define "content"}}

<div>
    <p class="border-b border-pink-900 py-1">Acciones</p>
    <ul class="flex gap-4 py-1">
        <li class="hover:text-zinc-400 transition-all cursor-pointer">
            Repositorio de ideas
        </li>
        <li class="hover:text-zinc-400 transition-all cursor-pointer">
            Nueva idea
        </li>
        <li class="hover:text-zinc-400 transition-all cursor-pointer">
            Subir archivo
        </li>
    </ul>
</div>

<ul class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
    {{range $idea := .ideas}}
    <li class="border-l-[4px] border-pink-400 p-1 flex flex-col gap-2">
        <p class="font-medium text-sm">
            {{$idea.Title}}
        </p>
        <p class="italic text-zinc-400">
            {{$idea.Content}}
        </p>
        <ul class="flex gap-2 text-[9px] mt-auto">
            <li class="bg-pink-200 text-zinc-950 p-0.5 rounded-xs font-semibold">Machine learning</li>
            <li class="bg-pink-200 text-zinc-950 p-0.5 rounded-xs font-semibold">Ciencia de datos</li>
            <li class="bg-pink-200 text-zinc-950 p-0.5 rounded-xs font-semibold">Matemáticas</li>
        </ul>
    </li>
    {{end}}

</ul>



{{end}}
