{{define "content"}}

<script src="https://unpkg.com/force-graph"></script>

<div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center justify-between border-b border-cyan-500 py-1 gap-4">
        <div class="flex items-center gap-6">
            <span class="font-medium text-zinc-100">Red de pensamiento</span>
            <div class="flex items-center gap-4 text-[11px] text-zinc-400">
                <span class="flex items-center gap-1.5">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                    Idea
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-amber-300"></span>
                    Tema clave
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="inline-block w-4 h-[2px] bg-cyan-400"></span>
                    Ideas afines
                </span>
                <span class="flex items-center gap-1.5">
                    <span class="inline-block w-4 h-[2px] bg-emerald-400"></span>
                    Temas en común
                </span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="toggle-keywords-btn" type="button"
                class="border border-zinc-800 hover:border-cyan-500 bg-zinc-900 px-2 py-0.5 rounded-xs cursor-pointer transition-all text-zinc-200">
                Ocultar temas
            </button>
            <button id="fit-graph-btn" type="button"
                class="border border-zinc-800 hover:border-cyan-500 bg-zinc-900 px-2 py-0.5 rounded-xs cursor-pointer transition-all text-zinc-200">
                Centrar red
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div id="graph-wrapper" class="lg:col-span-3 relative border border-zinc-800 rounded-xs bg-zinc-950 h-[72vh] overflow-hidden">
            <div id="network-graph" class="w-full h-full"></div>
            <div id="graph-stats" class="absolute bottom-2 left-2 bg-zinc-900/80 border border-zinc-800 px-2 py-1 rounded-xs text-[10px] text-zinc-400 pointer-events-none">
                Cargando red...
            </div>
        </div>

        <aside id="node-inspector" class="border border-zinc-800 rounded-xs bg-zinc-900 p-3 flex flex-col gap-3 h-[72vh] overflow-y-auto">
            <h3 class="text-sm font-medium text-zinc-100 border-b border-zinc-800 pb-1">
                Detalle de selección
            </h3>
            <div id="inspector-empty" class="text-zinc-500 my-auto text-center py-8">
                Selecciona una idea o tema en la red para ver su contenido y conexiones.
            </div>
            <div id="inspector-content" class="hidden flex-col gap-3">
                <div>
                    <span id="inspector-badge" class="text-[9px] uppercase px-1.5 py-0.5 rounded-xs font-semibold bg-cyan-500/20 text-cyan-300"></span>
                    <h4 id="inspector-title" class="text-sm font-medium text-zinc-100 mt-1"></h4>
                    <p id="inspector-meta" class="text-[10px] text-zinc-500 mt-0.5"></p>
                </div>
                <div id="inspector-summary-box" class="flex flex-col gap-1">
                    <span class="text-[10px] text-cyan-400 uppercase font-medium">Síntesis</span>
                    <p id="inspector-body" class="text-zinc-200 leading-relaxed whitespace-pre-line border-l-2 border-cyan-500 pl-2"></p>
                </div>
                <div id="inspector-original-box" class="flex flex-col gap-1">
                    <span class="text-[10px] text-zinc-400 uppercase font-medium">Nota original</span>
                    <p id="inspector-original" class="text-zinc-400 leading-relaxed whitespace-pre-line border-l-2 border-zinc-700 pl-2"></p>
                </div>
                <div id="inspector-keywords-box" class="flex flex-col gap-1.5 mt-2">
                    <span class="text-[10px] text-zinc-400 uppercase">Temas clave</span>
                    <ul id="inspector-keywords" class="flex flex-wrap gap-1.5 text-[9px]"></ul>
                </div>
                <div id="inspector-neighbors-box" class="flex flex-col gap-1.5 mt-2">
                    <span class="text-[10px] text-emerald-400 uppercase font-medium">Conexiones directas</span>
                    <ul id="inspector-neighbors" class="flex flex-col gap-1 text-[11px]"></ul>
                </div>
            </div>
        </aside>
    </div>
</div>

<script>
(() => {
    const container = document.getElementById("network-graph");
    const wrapper = document.getElementById("graph-wrapper");
    const statsEl = document.getElementById("graph-stats");
    const toggleKwBtn = document.getElementById("toggle-keywords-btn");
    const fitBtn = document.getElementById("fit-graph-btn");

    const emptyEl = document.getElementById("inspector-empty");
    const contentEl = document.getElementById("inspector-content");
    const badgeEl = document.getElementById("inspector-badge");
    const titleEl = document.getElementById("inspector-title");
    const metaEl = document.getElementById("inspector-meta");
    const summaryBoxEl = document.getElementById("inspector-summary-box");
    const bodyEl = document.getElementById("inspector-body");
    const originalBoxEl = document.getElementById("inspector-original-box");
    const originalEl = document.getElementById("inspector-original");
    const kwBoxEl = document.getElementById("inspector-keywords-box");
    const kwListEl = document.getElementById("inspector-keywords");
    const neighborsBoxEl = document.getElementById("inspector-neighbors-box");
    const neighborsListEl = document.getElementById("inspector-neighbors");

    let rawData = { nodes: [], links: [] };
    let showKeywords = true;
    let selectedNode = null;
    let neighborIds = new Set();
    let activeLinks = new Set();

    function getLinkEndpointId(endpoint) {
        return typeof endpoint === "object" && endpoint !== null ? endpoint.id : endpoint;
    }

    function computeHighlightSet(node) {
        neighborIds.clear();
        activeLinks.clear();
        if (!node) return;

        neighborIds.add(node.id);
        const currentLinks = Graph.graphData().links || [];

        currentLinks.forEach(link => {
            const srcId = getLinkEndpointId(link.source);
            const tgtId = getLinkEndpointId(link.target);
            if (srcId === node.id) {
                neighborIds.add(tgtId);
                activeLinks.add(link);
            } else if (tgtId === node.id) {
                neighborIds.add(srcId);
                activeLinks.add(link);
            }
        });

        if (node.type === "idea") {
            rawData.links.forEach(link => {
                if (link.type !== "semantic" && link.type !== "concept_overlap") return;
                const srcId = getLinkEndpointId(link.source);
                const tgtId = getLinkEndpointId(link.target);
                if (srcId === node.id) neighborIds.add(tgtId);
                if (tgtId === node.id) neighborIds.add(srcId);
            });
        }
    }

    function clearSelection() {
        selectedNode = null;
        neighborIds.clear();
        activeLinks.clear();
        emptyEl.classList.remove("hidden");
        contentEl.classList.add("hidden");
        contentEl.classList.remove("flex");
    }

    function selectNode(node) {
        selectedNode = node;
        computeHighlightSet(node);
        renderInspector(node);
        if (typeof node.x === "number" && typeof node.y === "number") {
            Graph.centerAt(node.x, node.y, 500);
            Graph.zoom(1.8, 500);
        }
    }

    function formatStatus(status) {
        const s = (status || "").toLowerCase();
        if (s === "processed" || s === "procesada") return "Procesada";
        if (s === "draft" || s === "borrador") return "Borrador";
        return status || "Borrador";
    }

    function formatNodeLabel(label) {
        if (!label) return "";
        if (label.length <= 24) return label;
        const chunkMatch = label.match(/\s*\(\d+\/\d+\)$/);
        if (chunkMatch) {
            const suffix = chunkMatch[0];
            const base = label.slice(0, label.length - suffix.length);
            const maxBase = Math.max(8, 22 - suffix.length);
            if (base.length > maxBase) {
                return base.slice(0, maxBase) + "…" + suffix;
            }
            return label;
        }
        return label.slice(0, 24) + "…";
    }

    const Graph = ForceGraph()(container)
        .backgroundColor("#09090b")
        .nodeId("id")
        .nodeLabel(node => node.label)
        .nodeVal(node => node.type === "idea" ? 5 : 2)
        .nodeColor(node => {
            if (!selectedNode) {
                return node.type === "idea" ? "#06b6d4" : "#fcd34d";
            }
            if (selectedNode.id === node.id) {
                return "#ffffff";
            }
            if (neighborIds.has(node.id)) {
                return node.type === "idea" ? "#34d399" : "#fbbf24";
            }
            return "rgba(63, 63, 70, 0.22)";
        })
        .nodeCanvasObjectMode(() => "after")
        .nodeCanvasObject((node, ctx, globalScale) => {
            const hasSelection = Boolean(selectedNode);
            const isSelected = hasSelection && selectedNode.id === node.id;
            const isNeighbor = hasSelection && !isSelected && neighborIds.has(node.id);

            if (isSelected || isNeighbor) {
                const ringRadius = (node.type === "idea" ? 6.5 : 4.2) + (isSelected ? 2 : 1);
                ctx.beginPath();
                ctx.arc(node.x, node.y, ringRadius, 0, 2 * Math.PI, false);
                ctx.strokeStyle = isSelected ? "#22d3ee" : (node.type === "idea" ? "#34d399" : "#fbbf24");
                ctx.lineWidth = (isSelected ? 2 : 1.4) / Math.max(1, globalScale * 0.6);
                ctx.stroke();
            }

            if (hasSelection && !isSelected && !isNeighbor) return;
            if (!hasSelection && node.type === "keyword" && globalScale < 1.35) return;
            if (!hasSelection && node.type === "idea" && globalScale < 0.55) return;

            const text = formatNodeLabel(node.label);
            const fontSize = Math.min(12, Math.max(10 / globalScale, 3.2));
            ctx.font = `${fontSize}px monospace`;
            const textWidth = ctx.measureText(text).width;
            const padX = fontSize * 0.35;
            const padY = fontSize * 0.2;
            const offsetY = node.type === "idea" ? 7 : 5;
            const boxX = node.x - textWidth / 2 - padX;
            const boxY = node.y + offsetY - padY;
            const boxW = textWidth + padX * 2;
            const boxH = fontSize + padY * 2;

            ctx.fillStyle = isSelected ? "rgba(8, 51, 68, 0.92)" : (isNeighbor ? "rgba(6, 78, 59, 0.88)" : "rgba(9, 9, 11, 0.78)");
            ctx.fillRect(boxX, boxY, boxW, boxH);

            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillStyle = isSelected ? "#ffffff" : (isNeighbor ? "#ecfdf5" : (node.type === "idea" ? "#e4e4e7" : "#d4d4d8"));
            ctx.fillText(text, node.x, node.y + offsetY);
        })
        .linkColor(link => {
            if (selectedNode) {
                if (activeLinks.has(link)) {
                    if (link.type === "semantic") return "rgba(34, 211, 238, 0.95)";
                    if (link.type === "concept_overlap") return "rgba(52, 211, 153, 0.95)";
                    return "rgba(251, 191, 36, 0.85)";
                }
                return "rgba(39, 39, 42, 0.12)";
            }
            if (link.type === "semantic") return "rgba(34, 211, 238, 0.45)";
            if (link.type === "concept_overlap") return "rgba(52, 211, 153, 0.45)";
            return "rgba(113, 113, 122, 0.28)";
        })
        .linkWidth(link => {
            const isHighlighted = selectedNode && activeLinks.has(link);
            if (selectedNode && !isHighlighted) return 0.4;
            const boost = isHighlighted ? 1.4 : 0;
            if (link.type === "semantic") return Math.max(1, link.weight * 2) + boost;
            if (link.type === "concept_overlap") return Math.min(3.5, 0.8 + link.weight * 0.6) + boost;
            return 0.7 + boost * 0.6;
        })
        .linkDirectionalParticles(link => {
            if (selectedNode) {
                return activeLinks.has(link) ? 3 : 0;
            }
            return (link.type === "semantic" || link.type === "concept_overlap") ? 1 : 0;
        })
        .linkDirectionalParticleWidth(link => (selectedNode && activeLinks.has(link)) ? 2.6 : 1.8)
        .linkDirectionalParticleSpeed(0.004)
        .onNodeClick(node => {
            selectNode(node);
        })
        .onBackgroundClick(() => {
            clearSelection();
        });

    Graph.d3Force("charge")
        .strength(node => node.type === "idea" ? -420 : -190)
        .distanceMax(800);

    Graph.d3Force("link")
        .distance(link => {
            if (link.type === "semantic") return 210 * (1.35 - Math.min(0.85, link.weight * 0.5));
            if (link.type === "concept_overlap") return 220;
            return 115;
        })
        .strength(link => {
            if (link.type === "semantic") return 0.16;
            if (link.type === "concept_overlap") return 0.14;
            return 0.35;
        });

    function renderInspector(node) {
        emptyEl.classList.add("hidden");
        contentEl.classList.remove("hidden");
        contentEl.classList.add("flex");

        if (node.type === "idea") {
            badgeEl.textContent = "Idea · " + formatStatus(node.status);
            badgeEl.className = "text-[9px] uppercase px-1.5 py-0.5 rounded-xs font-semibold bg-cyan-500/20 text-cyan-300";
            titleEl.textContent = node.label;
            metaEl.textContent = "Creado por: " + (node.userId || "-");

            const summaryText = node.content || "";
            const origText = node.originalContent || "";

            if (summaryText && summaryText !== origText) {
                bodyEl.textContent = summaryText;
                summaryBoxEl.classList.remove("hidden");
            } else {
                summaryBoxEl.classList.add("hidden");
            }

            if (origText) {
                originalEl.textContent = origText;
                originalBoxEl.classList.remove("hidden");
            } else if (summaryText) {
                originalEl.textContent = summaryText;
                originalBoxEl.classList.remove("hidden");
            } else {
                originalBoxEl.classList.add("hidden");
            }

            kwListEl.innerHTML = "";
            if (node.keywords && node.keywords.length > 0) {
                kwBoxEl.classList.remove("hidden");
                node.keywords.forEach(kw => {
                    const li = document.createElement("li");
                    li.className = "bg-cyan-200 text-zinc-950 p-0.5 rounded-xs font-semibold";
                    li.textContent = kw;
                    kwListEl.appendChild(li);
                });
            } else {
                kwBoxEl.classList.add("hidden");
            }
        } else {
            badgeEl.textContent = "Tema clave";
            badgeEl.className = "text-[9px] uppercase px-1.5 py-0.5 rounded-xs font-semibold bg-amber-400/20 text-amber-300";
            titleEl.textContent = "#" + node.label;
            metaEl.textContent = "Tema compartido en tu red";
            summaryBoxEl.classList.add("hidden");
            originalBoxEl.classList.add("hidden");
            kwBoxEl.classList.add("hidden");
        }
        const currentNodes = Graph.graphData().nodes || [];
        const connectedIdeas = currentNodes.filter(n => n.id !== node.id && n.type === "idea" && neighborIds.has(n.id));
        neighborsListEl.innerHTML = "";
        if (connectedIdeas.length > 0) {
            neighborsBoxEl.classList.remove("hidden");
            connectedIdeas.forEach(nb => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "w-full text-left px-2 py-1 rounded-xs bg-zinc-950 border border-zinc-800 hover:border-emerald-400 text-zinc-200 hover:text-emerald-300 cursor-pointer transition-all truncate";
                btn.textContent = nb.label;
                btn.addEventListener("click", () => selectNode(nb));
                li.appendChild(btn);
                neighborsListEl.appendChild(li);
            });
        } else {
            neighborsBoxEl.classList.add("hidden");
        }
    }

    function applyFilter() {
        const nodes = showKeywords
            ? rawData.nodes
            : rawData.nodes.filter(n => n.type === "idea");
        const allowedIds = new Set(nodes.map(n => n.id));
        const links = rawData.links
            .map(l => ({
                source: typeof l.source === "object" ? l.source.id : l.source,
                target: typeof l.target === "object" ? l.target.id : l.target,
                type: l.type,
                weight: l.weight
            }))
            .filter(l => allowedIds.has(l.source) && allowedIds.has(l.target));

        Graph.graphData({ nodes, links });
        if (selectedNode) {
            computeHighlightSet(selectedNode);
        }
        statsEl.textContent = `Elementos: ${nodes.length} | Conexiones: ${links.length}`;
    }

    function resizeGraph() {
        Graph.width(wrapper.clientWidth);
        Graph.height(wrapper.clientHeight);
    }

    window.addEventListener("resize", resizeGraph);
    resizeGraph();

    toggleKwBtn.addEventListener("click", () => {
        showKeywords = !showKeywords;
        toggleKwBtn.textContent = showKeywords ? "Ocultar temas" : "Mostrar temas";
        applyFilter();
    });

    fitBtn.addEventListener("click", () => {
        Graph.zoomToFit(400, 40);
    });

    fetch('{{url "api:network:graph"}}')
        .then(res => res.json())
        .then(data => {
            rawData = {
                nodes: data.nodes || [],
                links: data.links || []
            };
            applyFilter();
            setTimeout(() => Graph.zoomToFit(500, 40), 250);
        })
        .catch(() => {
            statsEl.textContent = "Error al cargar los datos de la red.";
        });
})();
</script>

{{end}}
