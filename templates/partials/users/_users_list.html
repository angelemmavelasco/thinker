<div class="overflow-x-auto border border-zinc-800 rounded-sm w-full">
    <table class="w-full text-left text-xs text-zinc-300 min-w-[500px]">
        <thead class="bg-zinc-900 border-b border-zinc-800 text-zinc-400 uppercase text-[11px]">
            <tr>
                <th class="py-2 px-3 font-medium">ID</th>
                <th class="py-2 px-3 font-medium">Usuario</th>
                <th class="py-2 px-3 font-medium">Creación</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-zinc-800/60 bg-zinc-950/40">
            {{range $user := .users}}
                <tr class="hover:bg-zinc-900/50 transition-colors">
                    <td class="py-2 px-3 text-zinc-500 font-mono text-[11px]">
                        {{$user.ID}}
                    </td>

                    <td class="py-2 px-3 text-zinc-200">
                        {{$user.Email}}
                    </td>

                    <td class="py-2 px-3 text-zinc-400 text-[11px]">
                        {{$user.CreatedAt.Format "02/01/2006 15:04"}}
                    </td>
                </tr>
            {{else}}
                <tr>
                    <td colspan="3" class="px-4 py-16 text-center text-zinc-500 text-xs">
                        No hay usuarios registrados.
                    </td>
                </tr>
            {{end}}
        </tbody>
    </table>
</div>
