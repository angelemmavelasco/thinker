<form
hx-post="/web/ideas/new"
hx-target="#workspace"
hx-swap="innerHTML"
hx-push-url="true"
class="
max-w-xl mx-auto
border border-zinc-800 rounded-xs
bg-zinc-900 p-2 flex flex-col gap-4
">
    
    <h3 class="text-sm font-medium text-zinc-100">Nueva idea</h3>

    <!-- title -->
    <div>
        <input type="text" name="title" placeholder="Título" required
            class="w-full outline-none border border-zinc-800 hover:border-cyan-500 rounded-xs bg-zinc-950 p-1 transition-all" />
    </div>


    <!-- content -->
    <div>
        <textarea name="content" rows="5" placeholder="Contenido de la idea" required
            class="w-full outline-none border border-zinc-800 hover:border-cyan-500 rounded-xs bg-zinc-950 p-1 transition-all"></textarea>
    </div>

    
    <div>
        <input type="file" name="doc" hidden>
        <button type="button" onclick="this.previousElementSibling.click()" class="cursor-pointer w-full outline-none border border-zinc-800 hover:border-cyan-500 rounded-xs bg-zinc-950 p-1 transition-all">
            Subir archivo
        </button>
    </div>

    <div class="flex gap-3 items-center justify-start">
        <button type="submit" class="border border-zinc-50 hover:border-cyan-500 text-zinc-50 hover:text-cyan-500 rounded p-1 cursor-pointer transition-all">
            Confirmar
        </button>
        <button
        type="button"
        hx-get="/web/ideas/list"
        hx-target="#workspace"
        hx-swap="innerHTML"
        class="text-zinc-50 hover:text-red-500 cursor-pointer transition-all">
            Cancelar
        </button>
    </div>
</form>
