<ul class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
    {{range $idea := .ideas}}
    <li class="border-l-[4px] border-cyan-500 p-1 flex flex-col gap-2">
        <p class="font-medium text-sm capitalize">
            {{$idea.Title}}
        </p>
        <p class="italic text-zinc-400">
            {{$idea.Content}}
        </p>
        <ul class="flex gap-2 text-[9px] mt-auto">
            <li class="bg-cyan-200 text-zinc-950 p-0.5 rounded-xs font-semibold">Machine learning</li>
            <li class="bg-cyan-200 text-zinc-950 p-0.5 rounded-xs font-semibold">Ciencia de datos</li>
            <li class="bg-cyan-200 text-zinc-950 p-0.5 rounded-xs font-semibold">Matemáticas</li>
        </ul>
    </li>
    {{else}}
    <li class="col-span-full py-12 text-center text-sm text-zinc-500">
        No hay ideas registradas todavía. Crea una nueva o sube un documento.
    </li>
    {{end}}

</ul>
