<div class="flex flex-col gap-2.5" data-md-container>
    <div class="flex flex-wrap items-center justify-between gap-2 text-[10px] text-zinc-400">
        <div class="flex flex-wrap items-center gap-2">
            <span class="font-medium text-zinc-200">{{.fullDoc.Title}}</span>
            <span class="px-1.5 py-0.5 rounded-xs bg-zinc-800 text-zinc-300 border border-zinc-700 font-mono">
                {{.fullDoc.GroupCount}} fragmentos
            </span>
            {{if .fullDoc.IsReconstructed}}
            <span class="px-1.5 py-0.5 rounded-xs bg-amber-500/15 text-amber-300 border border-amber-500/30" title="Ensamblado automáticamente desde los fragmentos vigentes eliminando el texto solapado">
                Ensamblado desde fragmentos
            </span>
            {{else}}
            <span class="px-1.5 py-0.5 rounded-xs bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                Documento íntegro
            </span>
            {{end}}
        </div>
    </div>

    <textarea id="idea-full-raw" data-md-source readonly class="hidden">{{.fullDoc.Content}}</textarea>

    <div
        id="idea-full-rendered"
        data-md-render
        class="markdown-body text-zinc-200 leading-relaxed border-l-2 border-cyan-500/60 pl-3.5 text-[13px] max-h-[68vh] overflow-y-auto pr-2"
    ></div>

    <pre
        id="idea-full-plain"
        class="hidden text-zinc-300 leading-relaxed whitespace-pre-wrap break-words font-mono border-l-2 border-cyan-500/60 pl-3.5 text-xs max-h-[68vh] overflow-y-auto pr-2"
    >{{.fullDoc.Content}}</pre>
</div>
<script>
(function () {
    if (typeof window.thinkerHydrateMarkdown === "function") {
        window.thinkerHydrateMarkdown(document.getElementById("idea-full-doc-panel") || document);
    }
    if (typeof window.thinkerSyncIdeaFormatMode === "function") {
        window.thinkerSyncIdeaFormatMode();
    }
})();
</script>
